name: Read Repos and Cleanup Stale Branches

"on":
  push:
    branches:
      - main
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no branches will be deleted)"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: cleanup-stale-branches
  cancel-in-progress: false

jobs:
  validate-token:
    name: Validate GitHub Token
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate GitHub token
        run: |
          set -e
          RESPONSE=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/user)

          echo "$RESPONSE" | jq -e '.login' >/dev/null \
            || { echo "Invalid GitHub token"; exit 1; }

  checkout-and-verify:
    name: Checkout Repository and Verify Repo List
    runs-on: ubuntu-latest
    needs: validate-token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repo list file
        run: |
          set -e
          REPO_FILE=".github/config/target-repos.txt"

          if [ ! -f "$REPO_FILE" ]; then
            echo "Repo list file not found: $REPO_FILE"
            exit 1
          fi

          echo "Repo list file found:"
          cat "$REPO_FILE"

  cleanup-branches:
    name: Cleanup Stale Branches
    runs-on: ubuntu-latest
    needs: checkout-and-verify
    env:
      OWNER: demoshu23
      STALE_DAYS: 2
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      GITHUB_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cleanup stale branches
        run: |
          set -euo pipefail

          REPO_FILE=".github/config/target-repos.txt"
          REPORT="readFromAFile.csv"

          echo "# Generated at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > "$REPORT"
          echo "repository,branch,days_old,action" >> "$REPORT"

          NOW=$(date +%s)

          while read -r REPO || [ -n "$REPO" ]; do
            [[ -z "$REPO" || "$REPO" =~ ^# ]] && continue

            FULL_REPO="$OWNER/$REPO"
            echo "Processing $FULL_REPO"

            BRANCHES=$(curl -s \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$FULL_REPO/branches?per_page=100")

            if ! echo "$BRANCHES" | jq -e 'type=="array"' >/dev/null; then
              echo "Failed to fetch branches for $FULL_REPO"
              continue
            fi

            echo "$BRANCHES" | jq -c '.[]' | while read -r branch; do
              BRANCH_NAME=$(echo "$branch" | jq -r '.name')

              case "$BRANCH_NAME" in
                main|master|develop|release/*)
                  continue
                  ;;
              esac

              COMMIT_URL=$(echo "$branch" | jq -r '.commit.url')

              COMMIT_DATE=$(curl -s \
                -H "Authorization: token $GITHUB_TOKEN" \
                "$COMMIT_URL" | jq -r '.commit.author.date')

              COMMIT_TS=$(date -d "$COMMIT_DATE" +%s)
              AGE_DAYS=$(( (NOW - COMMIT_TS) / 86400 ))

              if [ "$AGE_DAYS" -ge "$STALE_DAYS" ]; then
                if [ "$DRY_RUN" = "true" ]; then
                  ACTION="dry-run"
                  echo "[DRY-RUN] $FULL_REPO:$BRANCH_NAME ($AGE_DAYS days old)"
                else
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                    -H "Authorization: token $GITHUB_TOKEN" \
                    "https://api.github.com/repos/$FULL_REPO/git/refs/heads/$BRANCH_NAME")

                  if [ "$STATUS" -eq 204 ]; then
                    ACTION="deleted"
                  else
                    ACTION="failed"
                  fi
                fi

                echo "$FULL_REPO,$BRANCH_NAME,$AGE_DAYS,$ACTION" >> "$REPORT"
              fi
            done
          done < "$REPO_FILE"

  set-timestamp:
    name: Set Timestamp
    runs-on: ubuntu-latest
    needs: cleanup-branches
    outputs:
      ts: ${{ steps.timestamp.outputs.ts }}
    steps:
      - name: Generate timestamp
        id: timestamp
        run: |
          echo "ts=$(date '+%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

  upload-report:
    name: Upload Cleanup Report
    runs-on: ubuntu-latest
    needs: set-timestamp
    if: always()
    steps:
      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: readFromAFile-${{ needs.set-timestamp.outputs.ts }}
          path: readFromAFile.csv
          if-no-files-found: warn



