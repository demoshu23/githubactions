name: cleanup-stale-branches

trigger:
  branches:
    include:
      - main

schedules:
- cron: "0 2 * * 0"
  displayName: Weekly Sunday Cleanup
  branches:
    include:
      - main
  always: true

parameters:
- name: dryRun
  displayName: Dry Run (no branches deleted)
  type: string
  default: "true"

variables:
  OWNER: demoshu23
  STALE_DAYS: 2
  REPO_FILE: ".github/config/target-repos.txt"
  REPORT: "readFromAFile.csv"

stages:

# ---------------------------
# Validate GitHub Token
# ---------------------------
- stage: ValidateToken
  jobs:
  - job: validate
    pool:
      vmImage: ubuntu-latest

    steps:
    - script: |
        sudo apt-get update
        sudo apt-get install -y jq
      displayName: Install jq

    - script: |
        set -e

        RESPONSE=$(curl -s \
        -H "Authorization: token $(CLEANUP_TOKEN)" \
        https://api.github.com/user)

        echo "$RESPONSE" | jq -e '.login' >/dev/null \
        || { echo "Invalid GitHub token"; exit 1; }

        echo "GitHub token validated"
      displayName: Validate GitHub Token
      env:
        CLEANUP_TOKEN: $(CLEANUP_TOKEN)

# ---------------------------
# Checkout + Verify Repo List
# ---------------------------
- stage: VerifyRepoList
  dependsOn: ValidateToken

  jobs:
  - job: checkout
    pool:
      vmImage: ubuntu-latest

    steps:
    - checkout: self

    - script: |
        set -e

        if [ ! -f "$(REPO_FILE)" ]; then
          echo "Repo list file not found: $(REPO_FILE)"
          exit 1
        fi

        echo "Repo list file contents:"
        cat $(REPO_FILE)
      displayName: Verify Repo List

# ---------------------------
# Cleanup Branches
# ---------------------------
- stage: CleanupBranches
  dependsOn: VerifyRepoList

  jobs:
  - job: cleanup
    pool:
      vmImage: ubuntu-latest

    steps:
    - checkout: self

    - script: |
        sudo apt-get update
        sudo apt-get install -y jq
      displayName: Install jq

    - script: |
        set -euo pipefail

        OWNER=$(OWNER)
        STALE_DAYS=$(STALE_DAYS)
        DRY_RUN=${{ parameters.dryRun }}
        REPO_FILE=$(REPO_FILE)
        REPORT=$(REPORT)

        echo "# Generated at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > $REPORT
        echo "repository,branch,days_old,action" >> $REPORT

        NOW=$(date +%s)

        while read -r REPO || [ -n "$REPO" ]; do
          [[ -z "$REPO" || "$REPO" =~ ^# ]] && continue

          FULL_REPO="$OWNER/$REPO"
          echo "Processing $FULL_REPO"

          BRANCHES=$(curl -s \
          -H "Authorization: token $CLEANUP_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$FULL_REPO/branches?per_page=100")

          if ! echo "$BRANCHES" | jq -e 'type=="array"' >/dev/null; then
            echo "Failed to fetch branches for $FULL_REPO"
            continue
          fi

          echo "$BRANCHES" | jq -c '.[]' | while read -r branch; do

            BRANCH_NAME=$(echo "$branch" | jq -r '.name')

            case "$BRANCH_NAME" in
              main|master|develop|release/*)
                continue
                ;;
            esac

            COMMIT_URL=$(echo "$branch" | jq -r '.commit.url')

            COMMIT_DATE=$(curl -s \
              -H "Authorization: token $CLEANUP_TOKEN" \
              "$COMMIT_URL" | jq -r '.commit.author.date')

            COMMIT_TS=$(date -d "$COMMIT_DATE" +%s)

            AGE_DAYS=$(( (NOW - COMMIT_TS) / 86400 ))

            if [ "$AGE_DAYS" -ge "$STALE_DAYS" ]; then

              if [ "$DRY_RUN" = "true" ]; then
                ACTION="dry-run"
                echo "[DRY RUN] $FULL_REPO:$BRANCH_NAME ($AGE_DAYS days old)"

              else
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                -H "Authorization: token $CLEANUP_TOKEN" \
                "https://api.github.com/repos/$FULL_REPO/git/refs/heads/$BRANCH_NAME")

                if [ "$STATUS" -eq 204 ]; then
                  ACTION="deleted"
                else
                  ACTION="failed"
                fi
              fi

              echo "$FULL_REPO,$BRANCH_NAME,$AGE_DAYS,$ACTION" >> $REPORT
            fi

          done

        done < $REPO_FILE
      displayName: Cleanup Stale Branches
      env:
        CLEANUP_TOKEN: $(CLEANUP_TOKEN)

    - script: |
        TIMESTAMP=$(date '+%Y-%m-%d_%H-%M-%S')
        echo "##vso[task.setvariable variable=ts]$TIMESTAMP"
      displayName: Generate Timestamp

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: $(REPORT)
        ArtifactName: readFromAFile-$(ts)
        publishLocation: Container
      displayName: Upload CSV Report
